server:
  port: ${PORT:8080}
  shutdown: graceful
  # O Render termina o TLS em um proxy na frente da aplicação.
  forward-headers-strategy: framework

app:
  demo:
    # Cria dados sintéticos de demonstração (RN-16) na subida, só se não houver imóvel cadastrado.
    seed: ${DEMO_SEED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    jwt:
      # Segredo HMAC dos tokens, com 32 caracteres ou mais. Sem ele a aplicação não sobe.
      secret: ${JWT_SECRET:}
      validade: ${JWT_VALIDADE:8h}
    # Só usado se a tabela usuario estiver vazia: cria o primeiro acesso na subida.
    admin-inicial:
      nome: ${ADMIN_NOME:Administrador}
      email: ${ADMIN_EMAIL:}
      senha: ${ADMIN_SENHA:}
  fotos:
    tamanho-maximo: 5MB
    dimensao-maxima: 8000
    pixels-maximos: 40000000
  produtos:
    busca:
      # Teto de resultados por consulta da busca dinâmica; pedidos acima disto são reduzidos a ele.
      limite-maximo: ${PRODUTOS_BUSCA_LIMITE_MAXIMO:50}
  storage:
    supabase:
      url: ${SUPABASE_URL:}
      bucket: ${SUPABASE_STORAGE_BUCKET:imoveis}
      secret-key: ${SUPABASE_SECRET_KEY:}
      connect-timeout: 5s
      read-timeout: 20s

spring:
  application:
    name: gestao-casas-api
  profiles:
    default: local
  config:
    # Em desenvolvimento as variáveis vêm de backend/.env; em produção, do ambiente do Render.
    # Dois caminhos porque o diretório de trabalho muda: backend/ no terminal, raiz do repositório na IDE.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  jackson:
    deserialization:
      # Sem isto, 1.5 em um campo inteiro (quantidade, quartos) seria truncado para 1 em silêncio.
      accept-float-as-int: false

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:6MB}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Session Pooler do Supabase tem poucas conexões no plano gratuito: pool pequeno.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      max-lifetime: 1500000

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Horários (LocalTime) e datas vão ao banco como estão, sem conversão pelo fuso da JVM: com
          # time_zone UTC e a JVM em -03, "15:00" era gravado como 18:00.
          java_time_use_direct_jdbc: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
