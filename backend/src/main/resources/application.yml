server:
  port: ${PORT:8080}
  shutdown: graceful
  # O Render termina o TLS em um proxy na frente da aplicação.
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  fotos:
    # Upload, exclusão e foto principal usam a chave secreta do Storage. Sem autenticação na API,
    # ficam bloqueados (403) a menos que a variável seja true. Não habilite em ambiente público.
    escrita-habilitada: ${FOTOS_ESCRITA_HABILITADA:false}
    tamanho-maximo: 5MB
    dimensao-maxima: 8000
    pixels-maximos: 40000000
  storage:
    supabase:
      url: ${SUPABASE_URL:}
      bucket: ${SUPABASE_STORAGE_BUCKET:imoveis}
      secret-key: ${SUPABASE_SECRET_KEY:}
      connect-timeout: 5s
      read-timeout: 20s

spring:
  application:
    name: gestao-casas-api
  profiles:
    default: local
  config:
    # Em desenvolvimento as variáveis vêm de backend/.env; em produção, do ambiente do Render.
    # Dois caminhos porque o diretório de trabalho muda: backend/ no terminal, raiz do repositório na IDE.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:6MB}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Session Pooler do Supabase tem poucas conexões no plano gratuito: pool pequeno.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      max-lifetime: 1500000

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
